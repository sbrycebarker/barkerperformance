<title>BP | Profile</title>
<section id="profile-section" ng-controller="mainCtrl">

<div id="profile-con">


  <div id="profile-header">
    <div id="username">
      <h1>{{username}}</h1>
      <h1><img src="{{user.picture}}" alt=""></h1>
      <h1>{{user.emails[0].value}}</h1>
      <!-- <h1>{{}}</h1> -->
    </div>
  </div>

  <div id="profile-info">
    <div id="order-history">
      <div id="oh-list" ng-repeat="order in history">
        <h1>{{order}}</h1>
        <h1>{{order.number}}</h1>
      </div>
      <div>....</div>
    </div>
  </div>

</div>

</section>
