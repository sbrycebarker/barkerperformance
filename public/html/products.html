<title>BPF | Products</title>
<div id="products" class="products">
  <h1 class="title" class="animated fadeInLeft">NEW PRODUCTS</h1>
<div id="products-con">
<slick id="new-prod-con" class="things slick" style="margin: auto" init-onload="true" data-slick='{"slidesToShow": 1 }'>
  <ul class="p-item" ng-repeat="newpart in newPart">
    <img src="../assets/exploded-turbo.png">
    <h1>{{newpart.name}}</h1>
    <h1>$1</h1>
  </ul>
</slick>
  <h1 class="title">ALL PRODUCTS</h1>
<div id="all-products" class="things">
  <ul class="item" ui-sref="view({part: part._id})" ng-repeat="part in parts">
    <img src="{{part.img}}">
    <h1>{{part.name}}</h1>
    <h1>${{part.price}}</h1>
    <!-- <h1>part id: {{part.part_id}}</h1> -->
  </ul>
</div>
<div class="things">
</div>
</div>

<footer id="prod-footer">
<div>Icons made by <a href="http://www.freepik.com" title="Freepik">Freepik</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a> is licensed by <a href="http://creativecommons.org/licenses/by/3.0/" title="Creative Commons BY 3.0" target="_blank">CC 3.0 BY</a></div>
</footer>
</div>
