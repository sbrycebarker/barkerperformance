<!DOCTYPE HTML>
<html ng-app="app">
  <head>
    <link rel="icon" href="./assets/motor.png" type="image/png" sizes="18x18">

    <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.css"/>

    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:600,700" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="css/mobile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body ng-controller="mainCtrl" data-spy="scroll" data-target=".header-items" data-offset="50">
    <header>
      <!-- <div class="header-overlay"><div class="loader"></div></div> -->
      <div id="homebutton" class="header-items" onclick="home()"><a ui-sref="home"><h1><span style="color: white">Barker</span><br>Performance</h1></a></div>
      <div id="nav-con" class="header-items">

        <div id="home" class="nav" onclick="home()"><a ui-sref="home"><h1>HOME</h1></a></div>
        <div id="products" class="nav"><a ui-sref="products"><h1>PRODUCTS</h1></a></div>
        <div id="life" class="nav"><a ui-sref="life"><h1>LIFE</h1></a></div>
        <div id="about"class="nav" onclick="about()"><a ui-sref="home"><h1>ABOUT</h1></a></div>

      </div>

      <div class="rightbox">
        <div></div>
        <div class="login">
          <h1>{{users}}</h1>
        </div>

        <div id="cart" class="header-items">
          <h1>
            <i id="menu" class="fas fa-bars"></i>
            <i id="shop" class="fa fa-shopping-cart" aria-hidden="true"></i>
          </h1>
        </div>
      </div>
    </header>
    <script>

    function home() {
        $("html, body").animate({ scrollTop: "0" }, 1000)

    }

    function about() {
        $("html, body").animate({ scrollTop: "2777" }, 1000)

    }


    </script>
