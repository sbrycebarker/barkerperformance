<!DOCTYPE html>
<html ng-app="app">

<head>
  <link rel="icon" href="./assets/motor.png" type="image/png" sizes="18x18">
  <!-- <link rel="stylesheet" type="text/css" href="css/reset.css"> -->
  <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
  <script type="text/javascript" src="https://checkout.stripe.com/checkout.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.css">
  <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.css" />
  <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick-theme.css" />
  <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:600,700" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/laptop.css">
  <link rel="stylesheet" type="text/css" href="css/mobile.css">
  <link rel="stylesheet" type="text/css" href="css/profile.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body ng-controller="mainCtrl" data-spy="scroll" data-target=".header-items" data-offset="50">
  <header id="header">
    <!-- <div class="header-overlay"><div class="loader"></div></div> -->
    <div id="homebutton" class="header-items" onclick="home()"><a ui-sref="home"><h1><span style="color: white">Barker</span><br>Performance</h1></a></div>
    <div id="nav-con" class="header-items">

      <!-- <div id="mobile-login" class="m-login"><a>{{users}}</a></div> -->
      <div id="home" class="nav" onclick="home()"><a ui-sref="home"><h1>HOME</h1></a></div>
      <div id="products" class="nav"><a ui-sref="products"><h1>PRODUCTS</h1></a></div>
      <div id="life" class="nav"><a ui-sref="checkout"><h1>LIFE</h1></a></div>
      <div id="about" class="nav" onclick="about()"><a ui-sref="home"><h1>ABOUT</h1></a></div>
      <div id="profile" class="nav"><a ui-sref="profile"><h1>PROFILE</h1></a></div>
    </div>
    <div class="rightbox">
      <div></div>
      <div class="login">
        <h1><a href="/auth"><button type="submit" class="button-primary log">{{username}}</button></a></h1>
        <h1><a href="/auth/logout"><button type="submit" class="button-primary log">Logout</button></a></h1>
      </div>

      <div id="cart-btn" class="header-items" ng-click="cartOpen()">
        <h1>
            <i id="menu" ng-click="menuOpen()" class="fas fa-bars"></i>
            <i id="shop" class="fa fa-shopping-cart" aria-hidden="true"></i>
          </h1>
      </div>
    </div>
  </header>
  <div id="cart-side" class="cart-side">
    <div class="cart-head">
      <div class="arrowcont">
        <h1 class="closeCart" ng-click="closeCart()">></h1>
      </div>
      <h1>Cart</h1>
    </div>
    <div class="cartlist"></div>
    <!-- <form action="/charge" method="POST">
    <script
      src="https://checkout.stripe.com/checkout.js" class="stripe-button"
      data-key="pk_test_bLfWBEElGWXWGYBGUmZsMIbM"
      data-amount="300"
      data-name="Barker Performance"
      data-description="Example charge"
      data-image="https://stripe.com/img/documentation/checkout/marketplace.png"
      data-locale="auto"
      dat-currency= "usd">
    </script>
  </form> -->
    <div class="total">
      <h1>Total</h1>
      <h1>$ 300{{total}}</h1>
      <h1>
        <form action="/charge" method="POST">
        <script
          src="https://checkout.stripe.com/checkout.js" class="stripe-button"
          data-key="pk_test_bLfWBEElGWXWGYBGUmZsMIbM"
          data-amount="300"
          data-name="Barker Performance"
          data-description="Example charge"
          data-image="https://stripe.com/img/documentation/checkout/marketplace.png"
          data-locale="auto"
          dat-currency= "usd">
        </script>
      </form>
      </h1>
      <!-- <button class="viewcart"></button> -->
    </div>
  </div>
  <!-- <aside id="sidebar" class="sidebar"></aside> -->
  <ui-view></ui-view>
  <script>
    function home() {
      $("html, body").animate({
        scrollTop: "0"
      }, 1000)

    }

    function about() {
      $('main').ready(function() {
        console.log("ready")
        $("html, body").animate({
          scrollTop: "2350"
        }, 1000)
      })

    }
  </script>
  <script defer src="https://use.fontawesome.com/9c92e0c655.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.6/angular.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.3/angular-ui-router.js"></script>
  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://checkout.stripe.com/checkout.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/gh/kenwheeler/slick@1.8.1/slick/slick.min.js"></script>
  <script src="js/jquery.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mainCtrl.js"></script>
  <script src="js/navCtrl.js"></script>
  <script src="js/service.js"></script>
  <!-- <script src="js/auth0Service.js"></script> -->
</body>

</html>
