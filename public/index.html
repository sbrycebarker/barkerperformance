<!DOCTYPE html>
<html ng-app="app" ng-controller="mainCtrl">
<meta charset="utf-8">

<head>
  <link rel="icon" href="./assets/gears.png" type="image/png" sizes="18x18">
  <!-- <link rel="stylesheet" type="text/css" href="css/reset.css"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./assets/fontawesome/css/fontawesome.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://checkout.stripe.com/checkout.js"></script>
  <link rel="stylesheet" type="text/css" href="./css/meyer-reset.css">
  <link rel="stylesheet" type="text/css" href="./css/owl.carousel.min.css">
  <!-- <link rel="stylesheet" type="text/css" href="./assets/slick/slick/slick.css" />
  <link rel="stylesheet" type="text/css" href="./assets/slick/slick/slick-theme.css" /> -->
  <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:600,700" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/full.css">
  <link rel="stylesheet" href="css/laptop.css">
  <link rel="stylesheet" href="css/mobile.css">
  <base href="/">
</head>

<body data-spy="scroll" data-target=".header-items" data-offset="50">

  <header id="header">
    <!-- <div class="header-overlay"><div class="loader"></div></div> -->
    <div id="homebutton" class="header-items" ng-click="home()"><a ui-sref="home"><h1 class="draw"><span style="color: white">Barker</span><br>Performance</h1></a></div>
    <div id="nav-con" class="header-items">

      <!-- <div id="mobile-login" class="m-login"><a>{{users}}</a></div> -->
      <div id="home" class="nav" ng-click="home()">
        <a ui-sref="home">
          <h1>HOME</h1>
        </a>
      </div>
      <div id="products" class="nav">
        <a ui-sref="products">
          <h1>PRODUCTS</h1>
        </a>
      </div>
      <!-- <div id="life" class="nav">
        <a ui-sref="view">
          <h1>VIEW</h1>
        </a>
      </div> -->
      <div id="about" class="nav" ng-click="about()">
        <a ui-sref="home">
          <h1>ABOUT</h1>
        </a>
      </div>
      <div id="profile" class="nav">
        <a ui-sref="profile({user: user.displayName})">
          <h1>PROFILE</h1>
        </a>
      </div>
    </div>
    <div class="rightbox">
      <div></div>
      <div class="login">
        <h1><a href="/auth"><button type="submit" class="button-primary log">{{username}}</button></a></h1>
        <h1><a href="/auth/logout"><button type="submit" class="button-primary log">Logout</button></a></h1>
      </div>

      <div id="cart-btn" class="header-items" ng-click="cartOpen()">
        <h1>
            <i id="menu" ng-click="menuOpen()" class="fa fa-bars"></i>
            <i id="shop" class="fa fa-shopping-cart" aria-hidden="true"></i>
            <span class="cart-badge" ng-if="cartCount > 0">{{cartCount}}</span>
          </h1>
      </div>
    </div>
  </header>
  <div id="cart-side" class="cart-side">
    <div class="cart-head">
      <div class="arrowcont">
        <h1 class="closeCart" ng-click="closeCart()">></h1>
      </div>
      <h1>Cart</h1>
    </div>

    <div class="cartlist" ng-if="cart.length > 0">
      <div class="cartitem" ng-repeat="item in cart">
        <h1>{{item.part.name}}</h1>
        <h1>${{item.part.price}}</h1>
        <button class="remove-btn" ng-click="removeFromCart($index)">✕</button>
      </div>
    </div>

    <div class="empty-cart-message" ng-if="cart.length === 0">
      <i class="fa fa-shopping-cart empty-cart-icon"></i>
      <h2>Your cart is empty</h2>
      <p>Add some awesome parts to get started!</p>
    </div>
    <!-- <form action="/charge" method="POST">
    <script
      src="https://checkout.stripe.com/checkout.js" class="stripe-button"
      data-key="pk_test_bLfWBEElGWXWGYBGUmZsMIbM"
      data-amount="300"
      data-name="Barker Performance"
      data-description="Example charge"
      data-image="https://stripe.com/img/documentation/checkout/marketplace.png"
      data-locale="auto"
      dat-currency= "usd">
    </script>
  </form> -->
    <div class="total">
      <h1>Total</h1>
      <h1>${{total}}</h1>
      <button class="checkout-btn" ng-click="checkout()" ng-disabled="!cart || cart.length === 0">
        <i class="fa fa-credit-card"></i> Pay with Card
      </button>
      <p class="checkout-message" ng-if="checkoutMessage">{{checkoutMessage}}</p>
    </div>
  </div>
  <!-- <aside id="sidebar" class="sidebar"></aside> -->
  <ui-view></ui-view>
  <script>

  </script>
  <script defer src="https://use.fontawesome.com/9c92e0c655.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.8/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.20/angular-ui-router.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
  <script src="https://checkout.stripe.com/checkout.js"></script>
  <script type="text/javascript" src="assets/slick/slick/slick.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mainCtrl.js"></script>
  <script src="js/partsCtrl.js"></script>
  <script src="js/service.js"></script>
  <script src="js/owl.carousel.js" charset="utf-8"></script>
  <!-- <script src="js/auth0Service.js"></script> -->
  <script src="js/jquery.js"></script>
</body>

</html>
